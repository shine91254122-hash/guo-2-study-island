<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>風格群島 · 世界建築史</title>
<style>
:root{
  --paper:#fbf6ee;--ink:#211c18;--mute:#8d8177;--line:#ebe0d2;--acc:#c8553d;--soft:#fbe9e0;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --serif:Georgia,"Times New Roman","Songti TC",serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#5fbdca;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{display:flex;height:100vh;height:100dvh}
#stage{position:relative;flex:1;min-width:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv.drag{cursor:grabbing}
#cv.hot{cursor:pointer}
#lab{position:absolute;inset:0;pointer-events:none;overflow:hidden}

/* ---------- labels on the map ---------- */
.pill{position:absolute;left:0;top:0;pointer-events:auto;border:0;white-space:nowrap;
  background:rgba(255,253,249,.96);border-radius:999px;padding:5px 12px 5px 9px;font-size:12.5px;font-weight:700;
  box-shadow:0 2px 8px rgba(40,30,20,.2);transition:opacity .25s,background .15s;will-change:transform}
.pill i{font:600 10px var(--mono);color:var(--pc,var(--acc));margin-right:6px;font-style:normal}
.pill:hover{background:#fff}
.pill.off{opacity:0;pointer-events:none}
.mk{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;border:0;background:none;padding:0;will-change:transform;transition:opacity .25s}
.mk b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 11px var(--mono);
  background:rgba(255,253,249,.95);color:var(--pc);border:1.5px dashed var(--pc);box-shadow:0 2px 6px rgba(40,30,20,.2)}
.mk span{display:none;background:rgba(255,253,249,.97);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;box-shadow:0 2px 8px rgba(40,30,20,.2);white-space:nowrap}
.mk:hover span,.mk.on span{display:block}
.mk.on b{background:var(--pc);color:#fff;border-style:solid}
.mk.off{opacity:0;pointer-events:none}
#tip{position:absolute;left:0;top:0;pointer-events:none;background:#211c18;color:#fff;font-size:12px;padding:4px 9px;border-radius:7px;white-space:nowrap;opacity:0;transition:opacity .12s;z-index:5}

/* ---------- floating chrome ---------- */
.glass{background:rgba(253,248,240,.93);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 24px rgba(30,40,45,.16);border-radius:18px}
.brand{position:absolute;left:16px;top:16px;display:flex;align-items:center;gap:12px;padding:10px 16px 10px 14px;z-index:3}
.brand .wm{font-weight:900;font-size:22px;line-height:.92;letter-spacing:-.5px;color:var(--acc)}
.brand .tt{border-left:1px solid var(--line);padding-left:12px;line-height:1.35}
.brand .tt b{display:block;font-size:15px;letter-spacing:3px}
.brand .tt small{font:600 10px var(--mono);letter-spacing:1.5px;color:var(--acc)}
.tools{position:absolute;left:16px;top:84px;display:flex;gap:8px;z-index:3;flex-wrap:wrap;max-width:calc(100% - 32px)}
.grp{display:flex;gap:2px;padding:5px;border-radius:999px}
.tb{border:0;background:none;border-radius:999px;min-width:40px;height:40px;padding:0 9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;color:#6f645b;line-height:1}
.tb .g{font-size:14px;line-height:1}
.tb:hover{background:rgba(0,0,0,.05)}
.tb.on{background:#211c18;color:#fff}
.topb{position:absolute;right:16px;top:16px;display:flex;gap:8px;z-index:3}
.topb button{border:0;height:38px;padding:0 13px;border-radius:12px;font-size:12.5px;font-weight:600}
.topb button:hover{background:#fff}
#bList{display:none}

/* ---------- detail card ---------- */
#card{position:absolute;left:16px;top:142px;bottom:16px;width:340px;z-index:4;display:flex;flex-direction:column;overflow:hidden;animation:pop .35s cubic-bezier(.2,1,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
#card .in{overflow-y:auto;padding:18px 18px 16px;flex:1;touch-action:pan-y}
#card .x,#card .bk{border:0;background:none;font-size:13px;color:#6f645b;padding:4px 6px;border-radius:8px}
#card .x{position:absolute;right:10px;top:10px;font-size:20px;line-height:1;width:32px;height:32px}
#card .x:hover,#card .bk:hover{background:rgba(0,0,0,.06)}
#card .bk{margin:-4px 0 8px -6px}
.hd{display:flex;gap:12px;align-items:center;margin-bottom:10px;padding-right:30px}
.ico{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 14%,#fff);color:var(--acc);font:italic 700 20px var(--serif)}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:#fff;font:700 16px var(--serif)}
.av.big{width:46px;height:46px;font-size:20px}
.kick{font:600 10px var(--mono);letter-spacing:1.6px;color:var(--acc);margin-bottom:3px;text-transform:uppercase}
.hd h2{margin:0;font-size:20px;line-height:1.25}
.hd h2 small{display:block;font-size:11.5px;font-weight:500;color:var(--mute);margin-top:2px}
.era{font-size:12px;color:var(--mute);margin:2px 0 8px}
.desc{font-size:13.5px;line-height:1.75;margin:0 0 10px;color:#3b332d}
.quote{border-left:3px solid var(--acc);margin:0 0 12px;padding:2px 0 2px 11px;font-size:13.5px;font-weight:700;color:#3b332d}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chips span{font-size:11.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;color:#5d534b}
.chips span::before{content:"●";color:var(--acc);font-size:8px;margin-right:5px;vertical-align:1px}
.sec{font:600 10.5px var(--mono);letter-spacing:1.5px;color:var(--mute);margin:14px 0 8px}
.ar,.wr{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:13px;padding:9px 11px;margin-bottom:7px;transition:transform .12s,border-color .12s}
.ar:hover,.wr:hover{transform:translateX(2px);border-color:var(--acc)}
.ar .t,.wr .t{flex:1;min-width:0;line-height:1.3}
.ar .t b,.wr .t b{display:block;font-size:13.5px}
.ar .t small,.wr .t small{font-size:11px;color:var(--mute)}
.ar .n,.wr .n{font:500 10.5px var(--mono);color:var(--mute);white-space:nowrap}
.num{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 10.5px var(--mono);color:var(--acc);border:1.5px dashed var(--acc)}
.wk{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 12px;margin-bottom:9px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.wk:hover{border-color:var(--acc)}
.wk.on{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
.wk.on .num{background:var(--acc);color:#fff;border-style:solid}
.wk .wh{display:flex;gap:10px;align-items:center}
.wk .wh .t{flex:1;line-height:1.3}
.wk .wh .t b{display:block;font-size:14px}
.wk .wh .t small{font-size:11px;color:var(--mute)}
.wk .wh em{font:500 10.5px var(--mono);color:var(--mute);font-style:normal;white-space:nowrap}
.wk p{margin:8px 0 0;font-size:12.8px;line-height:1.7;color:#4a413a}
.wk .pl{font-size:11.5px;color:var(--acc);font-weight:600;margin-top:6px}
.nav{display:flex;gap:8px;margin-top:12px}
.nav button{flex:1;border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px;font-size:12px}
.nav button:hover{border-color:var(--acc);color:var(--acc)}

/* ---------- right index ---------- */
#idx{width:372px;flex:none;background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:6}
#idx .top{padding:22px 22px 12px}
#idx h1{margin:0 0 8px;font-size:25px;letter-spacing:1px}
.stat{font-size:12px;color:var(--mute);line-height:1.7}
.cta{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:14px 0 12px;padding:12px 14px;border-radius:14px;border:1px solid #f1d5c8;background:var(--soft)}
.cta b{display:block;font-size:14px;margin-bottom:2px}
.cta small{font-size:11.5px;color:#7a6a60;line-height:1.5;display:block}
.cta .go{margin-left:auto;color:var(--acc);font-size:18px}
.cta:hover{border-color:var(--acc)}
#q{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;font:inherit;font-size:13px;outline:none}
#q:focus{border-color:var(--acc)}
.tabs{display:flex;gap:8px;margin-top:12px}
.tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px;font-size:13px;font-weight:700}
.tabs button.on{background:#211c18;color:#fff;border-color:#211c18}
#list{flex:1;overflow-y:auto;padding:4px 14px 30px}
.row{display:flex;align-items:center;gap:14px;padding:13px 10px;border-radius:13px;cursor:pointer;border-left:3px solid transparent}
.row:hover{background:#fff}
.row.on{background:var(--soft);border-left-color:var(--rc,var(--acc))}
.row .no{font:italic 400 21px var(--serif);color:var(--rc,var(--acc));width:30px}
.row .nm{flex:1;font-size:14.5px;font-weight:700;line-height:1.25}
.row .nm small{display:block;font-size:11px;font-weight:500;color:var(--mute)}
.row .ct{font:500 11px var(--mono);color:var(--mute)}
.sub{padding:2px 0 10px 56px}
.sub .go2{border:0;background:none;color:var(--acc);font-weight:700;font-size:12.5px;padding:6px 0 8px}
.sa{font-size:12.5px;font-weight:700;padding:8px 6px 4px;cursor:pointer;border-radius:8px}
.sa small{font-weight:500;color:var(--mute);margin-left:6px;font-size:11px}
.sw{display:flex;gap:9px;align-items:center;font-size:12.5px;padding:6px;cursor:pointer;border-radius:8px;color:#4a413a}
.sw b{font:700 12px var(--mono);color:var(--acc)}
.sa:hover,.sw:hover{background:#fff}
.sw.on{background:#fff;font-weight:700}
.empty{padding:30px 10px;color:var(--mute);font-size:13px;text-align:center}

/* ---------- onboarding ---------- */
#onb{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(40,60,66,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:20px}
#onb .box{width:min(430px,100%);background:var(--paper);border-radius:20px;padding:26px 26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .4s cubic-bezier(.2,1,.3,1)}
#onb h3{margin:8px 0 12px;font-size:23px}
#onb p{font-size:14px;line-height:1.8;color:#4a413a;margin:0 0 22px;min-height:76px}
#onb .bt{display:flex;justify-content:space-between}
#onb button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 16px;font-size:14px;font-weight:700}
#onb button.pri{background:#211c18;color:#fff;border-color:#211c18}

/* ---------- small screens ---------- */
@media (max-width:860px){
  #idx{position:fixed;right:0;top:0;bottom:0;width:min(372px,92vw);transform:translateX(102%);transition:transform .35s cubic-bezier(.2,1,.3,1);box-shadow:-10px 0 40px rgba(0,0,0,.2)}
  #idx.open{transform:none}
  #bList{display:block}
  .brand{padding:8px 12px 8px 11px;left:10px;top:10px}
  .brand .wm{font-size:17px}
  .brand .tt b{font-size:13px;letter-spacing:2px}
  .topb{right:10px;top:10px;gap:5px}
  .topb button{padding:0 10px;height:36px}
  .tools{left:10px;top:66px;gap:6px}
  .tb{min-width:36px;height:36px;padding:0 7px}
  #card{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:46%}
}
@media (max-width:480px){ .topb .hideS{display:none} }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" aria-label="風格群島地圖"></canvas>
    <div id="lab"></div>

    <div class="brand glass">
      <div class="wm">ARCHI<br>ISLANDS.</div>
      <div class="tt"><b>世界建築史</b><small>STYLE 風格群島</small></div>
    </div>

    <div class="tools">
      <div class="grp glass" id="tod">
        <button class="tb" data-t="dawn" title="清晨"><span class="g">◐</span>晨</button>
        <button class="tb on" data-t="day" title="白天"><span class="g">☀</span>日</button>
        <button class="tb" data-t="dusk" title="黃昏"><span class="g">◑</span>昏</button>
        <button class="tb" data-t="night" title="夜晚"><span class="g">☾</span>夜</button>
      </div>
      <div class="grp glass">
        <button class="tb on" id="tLab" title="顯示島名"><span class="g">▭</span>名牌</button>
        <button class="tb on" id="tPpl" title="顯示居民"><span class="g">☺</span>居民</button>
        <button class="tb" id="tTour" title="自動導覽"><span class="g">▶</span>導覽</button>
        <button class="tb" id="tPause" title="暫停動畫"><span class="g">❙❙</span>暫停</button>
        <button class="tb" id="tBird" title="鳥瞰視角"><span class="g">◇</span>鳥瞰</button>
      </div>
    </div>

    <div class="topb">
      <button class="glass" id="bAll">↗ 全景</button>
      <button class="glass hideS" id="bRnd">⚄ 隨機登島</button>
      <button class="glass" id="bList">≡ 清單</button>
      <button class="glass" id="bHelp">?</button>
    </div>

    <section id="card" class="glass" hidden></section>
    <div id="tip"></div>
  </div>

  <aside id="idx">
    <div class="top">
      <div class="kick">The Style Index</div>
      <h1>把時代，蓋起來。</h1>
      <div class="stat" id="stat"></div>
      <button class="cta" id="cta"><span><b>搭上時光渡輪 ▶</b><small>從古典神廟一路航向解構主義，十二站自動導覽。</small></span><span class="go">›</span></button>
      <input id="q" placeholder="搜尋風格、建築師、建築…" autocomplete="off">
      <div class="tabs"><button class="on" data-tab="0">風格島</button><button data-tab="1" id="tabA">建築師</button></div>
    </div>
    <div id="list"></div>
  </aside>
</div>

<div id="onb" hidden>
  <div class="box">
    <div class="kick" id="oK"></div>
    <h3 id="oT"></h3>
    <p id="oP"></p>
    <div class="bt"><button id="oS">略過</button><button class="pri" id="oN">下一步 →</button></div>
  </div>
</div>

<script>
(()=>{'use strict';
const PI=Math.PI,TAU=PI*2,R=9,TOP=.8,D=19,APO=R*Math.cos(PI/6);
const $=s=>document.querySelector(s);
const rad=d=>d*PI/180;
const l2w=(lx,ly)=>[(lx+ly)*.7071,(-lx+ly)*.7071];
let seed=20261115;
const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};

/* =====================================================================
   1.  Tiny isometric modelling kit  (builds static face lists)
   ===================================================================== */
const RGB={};
function rgb(h){let c=RGB[h];if(!c){const n=parseInt(h.slice(1),16);c=RGB[h]=[n>>16,(n>>8)&255,n&255];}return c;}
let L=null,OX=0,OY=0,OZ=0,SC=1,BB=null;
function F(p,col,br,w){
  const c=rgb(col),q=new Float32Array(p.length);
  for(let i=0;i<p.length;i+=3){
    const x=OX+p[i]*SC,y=OY+p[i+1]*SC,z=OZ+p[i+2]*SC;q[i]=x;q[i+1]=y;q[i+2]=z;
    if(x<BB[0])BB[0]=x;if(y<BB[1])BB[1]=y;if(z<BB[2])BB[2]=z;if(x>BB[3])BB[3]=x;if(y>BB[4])BB[4]=y;if(z>BB[5])BB[5]=z;
  }
  L.push({p:q,r:c[0]*br,g:c[1]*br,b:c[2]*br,w:w||0,v:-1,f:''});
}
function build(fn,ox,oy,oz,sc){L=[];OX=ox;OY=oy;OZ=oz;SC=sc||1;BB=[1e9,1e9,1e9,-1e9,-1e9,-1e9];fn();return{L:L,bb:BB,x:ox,y:oy,d:ox+oy};}

const ng=(cx,cy,r,n,rot,sx,sy)=>{const o=[];rot=rot||0;sx=sx||1;sy=sy||1;for(let i=0;i<n;i++){const t=rot+TAU*i/n;o.push([cx+Math.cos(t)*r*sx,cy+Math.sin(t)*r*sy]);}return o;};
const sq=(cx,cy,w,d)=>[[cx-w/2,cy-d/2],[cx+w/2,cy-d/2],[cx+w/2,cy+d/2],[cx-w/2,cy+d/2]];
const ringSeg=(cx,cy,r0,r1,a0,a1,n)=>{const o=[];for(let i=0;i<=n;i++){const t=a0+(a1-a0)*i/n;o.push([cx+Math.cos(t)*r1,cy+Math.sin(t)*r1]);}for(let i=n;i>=0;i--){const t=a0+(a1-a0)*i/n;o.push([cx+Math.cos(t)*r0,cy+Math.sin(t)*r0]);}return o;};
const chamf=(cx,cy,w,c)=>{const h=w/2;return[[cx-h+c,cy-h],[cx+h-c,cy-h],[cx+h,cy-h+c],[cx+h,cy+h-c],[cx+h-c,cy+h],[cx-h+c,cy+h],[cx-h,cy+h-c],[cx-h,cy-h+c]];};
const rrect=(cx,cy,ux,uy,len,wid)=>{const nx=-uy,ny=ux,a=len/2,b=wid/2;return[[cx-ux*a-nx*b,cy-uy*a-ny*b],[cx+ux*a-nx*b,cy+uy*a-ny*b],[cx+ux*a+nx*b,cy+uy*a+ny*b],[cx-ux*a+nx*b,cy-uy*a+ny*b]];};
const sorted=items=>{items.sort((p,q)=>p[0]-q[0]);for(const it of items)it[1]();};

function wins(A,B,z0,za,zb,w,br,sd){
  const nx=w.nx||1,ny=w.ny||1,px=w.px==null?.2:w.px,py=w.py==null?.25:w.py,v0=w.z0||0,v1=w.z1==null?1:w.z1;
  const X=u=>A[0]+(B[0]-A[0])*u,Y=u=>A[1]+(B[1]-A[1])*u,Z=(u,v)=>z0+((za+(zb-za)*u)-z0)*v;
  for(let c=0;c<nx;c++)for(let r=0;r<ny;r++){
    const u0=(c+px)/nx,u1=(c+1-px)/nx,a=v0+(v1-v0)*(r+py)/ny,b=v0+(v1-v0)*(r+1-py)/ny;
    F([X(u0),Y(u0),Z(u0,a),X(u1),Y(u1),Z(u1,a),X(u1),Y(u1),Z(u1,b),X(u0),Y(u0),Z(u0,b)],w.col||'#7c8a93',br,w.nolit?0:(((c*7+r*13+sd*5)%3)?2:1));
  }
}
/* extrude a polygon; h may be a number or per-vertex array */
function ex(pts,z0,h,col,o){
  o=o||{};const n=pts.length;let a=0;
  for(let i=0;i<n;i++){const j=(i+1)%n;a+=pts[i][0]*pts[j][1]-pts[j][0]*pts[i][1];}
  const sg=a>0?1:-1,T=i=>z0+(h.length?h[i]:h),fs=[];
  for(let i=0;i<n;i++){const j=(i+1)%n,dx=pts[j][0]-pts[i][0],dy=pts[j][1]-pts[i][1],nx=dy*sg,ny=-dx*sg;
    if(nx+ny<=1e-6)continue;fs.push([pts[i][0]+pts[i][1]+pts[j][0]+pts[j][1],i,j,ny/Math.hypot(nx,ny)]);}
  fs.sort((p,q)=>p[0]-q[0]);
  for(const f of fs){const A=pts[f[1]],B=pts[f[2]],br=.72+.19*f[3],za=T(f[1]),zb=T(f[2]);
    F([A[0],A[1],z0,B[0],B[1],z0,B[0],B[1],zb,A[0],A[1],za],o.side||col,br);
    if(o.win)wins(A,B,z0,za,zb,o.win,br,f[1]);}
  if(!o.notop){const p=[];for(let i=0;i<n;i++)p.push(pts[i][0],pts[i][1],T(i));F(p,o.top||col,o.tb||1);}

const mob=()=>W<700;

  const sp=Math.sin(tg.p),cp=Math.cos(tg.p),padT=mob()?118:96;
  tg.s=Math.max(mob()?5.6:4.2,Math.min((W-20)/(3.5*D+2*R+7),(H-padT-20)/((1.732*D+2*R+2)*sp+6*cp)));
  const c=l2w(CX+1,CY);tg.x=c[0];tg.y=c[1];tg.ox=0;tg.oy=padT/2+cp*tg.s*1.5;
}
function focus(i){
  const I=ISL[i],sp=Math.sin(tg.p),cp=Math.cos(tg.p),m=mob();
  const aw=m?W-6:W-380,ah=m?H*.42:H-80;
  tg.s=Math.max(9,Math.min(aw/18.5,ah/(19*sp+8.5*cp),48));

}
function retarget(){if(sel.i==null)fit();else focus(sel.i);}
function resize(){const r=stage.getBoundingClientRect();W=Math.max(50,r.width);H=Math.max(50,r.height);DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;retarget();}
function bbox(o){const b=o.bb;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(let c=0;c<8;c++){const x=b[c&1?3:0],y=b[c&2?4:1],z=b[c&4?5:2],X=PX(x,y),Y=PY(x,y,z);if(X<x0)x0=X;if(X>x1)x1=X;if(Y<y0)y0=Y;if(Y>y1)y1=Y;}return[x0,y0,x1,y1];}
function hit(mx,my){
  let best=null,bd=-1e9;
  for(const I of ISL)for(const w of I.works){const b=bbox(w.obj),pad=(b[2]-b[0])*.1;if(mx>=b[0]+pad&&mx<=b[2]-pad&&my>=b[1]&&my<=b[3]&&w.obj.d>bd){best=w;bd=w.obj.d;}}
  if(best&&cam.s>=13)return{I:best.I,w:best};
  const u=(mx-vx)/A,v=(my-vy+TOP*Cz)/Bp,x=(u+v)/2,y=(v-u)/2;
  for(const I of ISL)if(Math.hypot(x-I.x,y-I.y)<R*.97)return{I:I};
  if(best)return{I:best.I};
  return null;
}
const lab=$('#lab'),pills=[],marks=[];
ISL.forEach((I,i)=>{const b=document.createElement('button');b.className='pill';b.style.setProperty('--pc',I.acc);b.innerHTML='<i>'+String(i+1).padStart(2,'0')+'</i>'+I.name;b.onclick=()=>pick(i);lab.appendChild(b);pills.push(b);});
for(let n=0;n<6;n++){const b=document.createElement('button');b.className='mk off';b.innerHTML='<b></b><span></span>';b.onclick=()=>{if(sel.i!=null)pick(sel.i,null,n);};lab.appendChild(b);marks.push(b);}
const CIRC='①②③④⑤⑥⑦⑧';
function placeLabels(){
  ISL.forEach((I,i)=>{const p=pills[i],wx=I.x+(R-.4)*.7071,wy=I.y+(R-.4)*.7071,X=PX(wx,wy),Y=PY(wx,wy,.3)+4;
    const off=!showLab||sel.i===i||X<-60||X>W+60||Y<-30||Y>H+30;
    p.classList.toggle('off',off);if(!off)p.style.transform='translate('+X.toFixed(1)+'px,'+Y.toFixed(1)+'px) translate(-50%,-50%)';});
  const I=sel.i==null?null:ISL[sel.i];
  marks.forEach((m,n)=>{const w=I&&I.works[n];if(!w){m.classList.add('off');return;}
    const X=PX(w.wx,w.wy),Y=PY(w.wx,w.wy,w.obj.bb[5]+.5);
    m.classList.remove('off');m.classList.toggle('on',sel.w===n);m.style.transform='translate('+(X-12).toFixed(1)+'px,'+(Y-12).toFixed(1)+'px)';});
}
function syncMarks(){const I=sel.i==null?null:ISL[sel.i];marks.forEach((m,n)=>{const w=I&&I.works[n];if(!w)return;m.style.setProperty('--pc',I.acc);m.firstChild.textContent=w.no;m.lastChild.textContent=w.n;});}

/* =====================================================================
   7.  UI: card + index
   ===================================================================== */
const card=$('#card'),list=$('#list'),qEl=$('#q');let tab=0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pick(i,a,w,keepTour){
  if(!keepTour&&tour)setTour(false);
  if(i==null){sel.i=sel.a=sel.w=null;}
  else{sel.i=i;if(w!=null){sel.w=w;sel.a=ISL[i].works[w].a.ai;}else{sel.a=a==null?null:a;sel.w=null;}}
  retarget();syncMarks();renderCard();renderList();
  if(i!=null)$('#idx').classList.remove('open');
}
function renderCard(){
  if(sel.i==null){card.hidden=true;return;}
  const I=ISL[sel.i],no=String(sel.i+1).padStart(2,'0');card.style.setProperty('--acc',I.acc);
  let h='<button class="x" data-x aria-label="關閉">×</button><div class="in">';
  if(sel.a==null){
    h+='<div class="hd"><div class="ico">'+no+'</div><div><div class="kick">Style '+no+' · 風格島</div><h2>'+esc(I.name)+'<small>'+esc(I.en)+'</small></h2></div></div>'
     +'<div class="era">'+esc(I.era)+'</div><p class="desc">'+esc(I.desc)+'</p><div class="quote">「'+esc(I.tag)+'」</div>'
     +'<div class="chips">'+I.chips.map(c=>'<span>'+esc(c)+'</span>').join('')+'<span>'+I.archs.length+' 位建築師</span><span>'+I.works.length+' 件建築</span></div>'
     +'<div class="sec">島上的建築師</div>'
     +I.archs.map(a=>'<button class="ar" data-a="'+a.ai+'"><span class="av">'+esc(a.en[0])+'</span><span class="t"><b>'+esc(a.name)+'</b><small>'+esc(a.en)+' · '+esc(a.yrs)+'</small></span><span class="n">'+a.works.length+' 件 ›</span></button>').join('')
     +'<div class="sec">島上的建築</div>'
     +I.works.map(w=>'<button class="wr" data-w="'+(w.no-1)+'"><span class="num">'+w.no+'</span><span class="t"><b>'+esc(w.n)+'</b><small>'+esc(w.a.name)+'</small></span><span class="n">'+esc(w.y)+' ›</span></button>').join('')
     +'<div class="nav"><button data-go="'+((sel.i+ISL.length-1)%ISL.length)+'">‹ 上一座島</button><button data-go="'+((sel.i+1)%ISL.length)+'">下一座島 ›</button></div>';
  }else{
    const a=I.archs[sel.a];
    h+='<button class="bk" data-bk>‹ '+esc(I.name)+'島</button>'
     +'<div class="hd"><span class="av big">'+esc(a.en[0])+'</span><div><div class="kick">Architect · 建築師</div><h2>'+esc(a.name)+'<small>'+esc(a.en)+' · '+esc(a.yrs)+'</small></h2></div></div>'
     +'<p class="desc">'+esc(a.bio)+'</p><div class="sec">代表建築 · '+a.works.length+' 件</div>'
     +a.works.map(w=>'<div class="wk'+(sel.w===w.no-1?' on':'')+'" data-w="'+(w.no-1)+'"><div class="wh"><span class="num">'+w.no+'</span><span class="t"><b>'+esc(w.n)+'</b><small>'+esc(w.e)+'</small></span><em>'+esc(w.y)+'</em></div><p>'+esc(w.d)+'</p><div class="pl">◎ '+esc(w.pl)+'</div></div>').join('')
     +'<div class="nav">'+I.archs.filter(o=>o!==a).map(o=>'<button data-a="'+o.ai+'">'+esc(o.name)+' ›</button>').join('')+'</div>';
  }
  card.innerHTML=h+'</div>';card.hidden=false;
  const on=card.querySelector('.wk.on');if(on)on.scrollIntoView({block:'nearest'});
}
card.addEventListener('click',e=>{
  const t=e.target.closest('[data-x],[data-bk],[data-a],[data-w],[data-go]');if(!t)return;
  if(t.hasAttribute('data-x'))pick(null);
  else if(t.hasAttribute('data-bk'))pick(sel.i);
  else if(t.dataset.go!=null)pick(+t.dataset.go);
  else if(t.dataset.a!=null)pick(sel.i,+t.dataset.a);
  else if(t.dataset.w!=null)pick(sel.i,null,+t.dataset.w);
});
function renderList(){
  const q=qEl.value.trim().toLowerCase(),m=s=>s.toLowerCase().includes(q);let h='';
  if(tab===0){
    ISL.forEach((I,i)=>{
      const hitI=!q||m(I.name)||m(I.en),ha=I.archs.filter(a=>hitI||m(a.name)||m(a.en)||a.works.some(w=>m(w.n)||m(w.e)));
      if(q&&!ha.length)return;const on=sel.i===i;
      h+='<div class="row'+(on?' on':'')+'" data-i="'+i+'" style="--rc:'+I.acc+'"><span class="no">'+String(i+1).padStart(2,'0')+'</span><span class="nm">'+esc(I.name)+'<small>'+esc(I.en)+'</small></span><span class="ct">'+I.works.length+' ↗</span></div>';
      if(on||q){h+='<div class="sub">'+(on?'<button class="go2" data-i="'+i+'">探索此風格島 ↗</button>':'');
        for(const a of(q?ha:I.archs)){h+='<div class="sa" data-i="'+i+'" data-a="'+a.ai+'">'+esc(a.name)+'<small>'+esc(a.yrs)+'</small></div>';
          for(const w of a.works)h+='<div class="sw'+(on&&sel.w===w.no-1?' on':'')+'" data-i="'+i+'" data-w="'+(w.no-1)+'"><b>'+CIRC[w.no-1]+'</b>'+esc(w.n)+'</div>';}
        h+='</div>';}
    });
  }else{
    ISL.forEach((I,i)=>I.archs.forEach(a=>{if(q&&!(m(a.name)||m(a.en)||m(I.name)||a.works.some(w=>m(w.n)||m(w.e))))return;
      h+='<div class="row'+(sel.i===i&&sel.a===a.ai?' on':'')+'" data-i="'+i+'" data-a="'+a.ai+'" style="--rc:'+I.acc+'"><span class="no">'+esc(a.en[0])+'</span><span class="nm">'+esc(a.name)+'<small>'+esc(I.name)+' · '+esc(a.works.map(w=>w.n).join('、'))+'</small></span><span class="ct">'+a.works.length+' ↗</span></div>';}));
  }
  list.innerHTML=h||'<div class="empty">找不到符合的島嶼，換個關鍵字試試。</div>';
  const on=list.querySelector('.sw.on')||list.querySelector('.row.on');if(on&&!q)on.scrollIntoView({block:'nearest'});
}
list.addEventListener('click',e=>{const t=e.target.closest('[data-i]');if(!t)return;const i=+t.dataset.i;
  if(t.dataset.w!=null)pick(i,null,+t.dataset.w);else if(t.dataset.a!=null)pick(i,+t.dataset.a);else if(t.classList.contains('row')&&sel.i===i&&sel.a==null&&!qEl.value)pick(null);else pick(i);});
qEl.addEventListener('input',renderList);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=+b.dataset.tab;document.querySelectorAll('.tabs button').forEach(o=>o.classList.toggle('on',o===b));renderList();});
$('#stat').innerHTML=ISL.length+' 座風格島 ／ '+NA+' 位建築師 ／ '+NW+' 件建築<br>選一座島，走進那個時代的城市風景。';
$('#tabA').textContent='建築師 '+NA;

/* toolbar */
function setTour(v){tour=v;tourT=5.5;$('#tTour').classList.toggle('on',v);}
$('#tod').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;tod=b.dataset.t;document.querySelectorAll('#tod .tb').forEach(o=>o.classList.toggle('on',o===b));});
$('#tLab').onclick=function(){showLab=!showLab;this.classList.toggle('on',showLab);};
$('#tPpl').onclick=function(){showPpl=!showPpl;this.classList.toggle('on',showPpl);};
$('#tTour').onclick=()=>setTour(!tour);
$('#cta').onclick=()=>{$('#idx').classList.remove('open');setTour(true);tourT=7;};
$('#tPause').onclick=function(){paused=!paused;this.classList.toggle('on',paused);};
$('#tBird').onclick=function(){const on=tg.p<.9;tg.p=on?1.13:.61;this.classList.toggle('on',on);retarget();};
$('#bAll').onclick=()=>pick(null);
$('#bRnd').onclick=()=>{let i;do{i=(Math.random()*ISL.length)|0;}while(i===sel.i);pick(i);};
$('#bList').onclick=()=>$('#idx').classList.toggle('open');

/* pointer: pan / zoom / pick */
const ptr=new Map();let moved=0,pinch=0;
function panBy(dx,dy){const u=dx/A,v=dy/Bp,wx=(u+v)/2,wy=(v-u)/2;cam.x-=wx;cam.y-=wy;tg.x=cam.x;tg.y=cam.y;}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);moved=0;if(ptr.size===2){const p=[...ptr.values()];pinch=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);}});
cv.addEventListener('pointermove',e=>{
  const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,p=ptr.get(e.pointerId);
  if(p){const dx=e.clientX-p[0],dy=e.clientY-p[1];moved+=Math.abs(dx)+Math.abs(dy);ptr.set(e.pointerId,[e.clientX,e.clientY]);
    if(ptr.size===1){if(moved>5){cv.classList.add('drag');panBy(dx,dy);if(tour)setTour(false);}}
    else if(ptr.size===2){const q=[...ptr.values()],d=Math.hypot(q[0][0]-q[1][0],q[0][1]-q[1][1]);if(pinch>0){tg.s=cam.s=Math.max(3.5,Math.min(70,cam.s*d/pinch));}pinch=d;}
    return;}
  const h=hit(mx,my);cv.classList.toggle('hot',!!h);const tip=$('#tip');
  if(h&&e.pointerType==='mouse'){tip.textContent=h.w?h.w.n+' · '+h.w.a.name:String(h.I.i+1).padStart(2,'0')+' '+h.I.name+'島';tip.style.transform='translate('+(mx+14)+'px,'+(my+16)+'px)';tip.style.opacity=1;}else tip.style.opacity=0;
});
const up=e=>{const had=ptr.has(e.pointerId);ptr.delete(e.pointerId);cv.classList.remove('drag');if(!had||ptr.size)return;
  if(moved<=5&&e.type==='pointerup'){const r=cv.getBoundingClientRect(),h=hit(e.clientX-r.left,e.clientY-r.top);
    if(h){if(h.w&&sel.i===h.I.i)pick(h.I.i,null,h.w.no-1);else pick(h.I.i);}}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',()=>{$('#tip').style.opacity=0;});
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  const u0=(mx-vx)/A,v0=(my-vy)/Bp,ns=Math.max(3.5,Math.min(70,cam.s*Math.exp(-e.deltaY*.0015))),f=ns/cam.s;
  cam.s=tg.s=ns;const u1=u0/f,v1=v0/f,du=u0-u1,dv=v0-v1;cam.x+=(du+dv)/2;cam.y+=(dv-du)/2;tg.x=cam.x;tg.y=cam.y;if(tour)setTour(false);},{passive:false});
window.addEventListener('keydown',e=>{if(e.target===qEl)return;
  if(e.key==='Escape'){if(!$('#onb').hidden)closeOnb();else if(sel.a!=null)pick(sel.i);else pick(null);}
  else if(e.key==='ArrowRight')pick(((sel.i==null?-1:sel.i)+1)%ISL.length);
  else if(e.key==='ArrowLeft')pick(((sel.i==null?0:sel.i)+ISL.length-1)%ISL.length);});

/* onboarding */
const STEPS=[['Hello, Architecture / 01','每座島，是一種風格','十二座六角島依照年代排成一條時光航線：從古希臘神廟出發，穿過哥德、文藝復興、巴洛克，一路航向當代。點任何一座島就能登島。'],
 ['Hello, Architecture / 02','島上住著建築大師','每座島都有代表性的建築師，以及他們親手留下的建築。點左側卡片的建築師，或直接點島上的房子，看它的故事。'],
 ['Hello, Architecture / 03','換個時間、換個角度','上方工具列可以切換晨、日、昏、夜，開啟鳥瞰視角，或按「導覽」讓時光渡輪帶你一站一站逛。拖曳可平移，滾輪可縮放。']];
let ob=0;
function showOnb(){ob=0;paintOnb();$('#onb').hidden=false;}
function paintOnb(){const s=STEPS[ob];$('#oK').textContent=s[0];$('#oT').textContent=s[1];$('#oP').textContent=s[2];$('#oN').textContent=ob===STEPS.length-1?'開始探索 →':'下一步 →';}
function closeOnb(){$('#onb').hidden=true;try{localStorage.setItem('archi-islands-seen','1');}catch(e){}}
$('#oS').onclick=closeOnb;$('#oN').onclick=()=>{if(++ob>=STEPS.length)closeOnb();else paintOnb();};
$('#bHelp').onclick=showOnb;

/* go */
window.addEventListener('resize',resize);
resize();Object.assign(cam,tg);renderList();
let seen=false;try{seen=!!localStorage.getItem('archi-islands-seen');}catch(e){}
if(!seen)showOnb();
if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){paused=true;$('#tPause').classList.add('on');}
requestAnimationFrame(frame);
})();
</script>
